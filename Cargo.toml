[package]
name    = "pstream-backend"
version = "0.1.0"
edition = "2021"

# Rust port of the giga backend (index.js + resolver.js + services/).
#
# Unlike the phone resolver, this runs on a Hugging Face Space — x86_64, no
# battery or memory pressure — so the motivation here is not binary size but
# the same thing that made the resolver port worth doing: no node_modules to
# resolve at deploy time, and the compiler catching the shape of every payload.

[dependencies]
tokio      = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "process", "fs"] }
axum       = { version = "0.7", default-features = false, features = ["http1", "json", "query", "tokio", "matched-path"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }

# rustls rather than OpenSSL, matching the resolver — keeps the container
# free of a system TLS dependency.
reqwest    = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "brotli", "cookies", "stream"] }

serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
regex       = "1"
once_cell   = "1"
futures     = "0.3"
bytes       = "1"
urlencoding = "2"

# ── replacing the JS dependencies ────────────────────────────────────────────
redis         = { version = "0.27", features = ["tokio-comp", "connection-manager"] }  # ioredis
jsonwebtoken  = "9"                                                                    # jsonwebtoken
ed25519-dalek = { version = "2", features = ["rand_core"] }                            # tweetnacl sign/verify
rand          = "0.8"
base64        = "0.22"
hex           = "0.4"
dotenvy       = "0.15"                                                                 # dotenv
chrono        = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 4
