[package]
name    = "pstream-backend"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Coderia397/pstream-backend-rs"

# Rust port of the giga backend (index.js + resolver.js + services/).
#
# NOTE: the JS service this replaces is not deployed anywhere — the frontend
# points at the phone resolver, and calls Supabase directly. See PORTING.md
# before adding routes here; most of the 37 have no caller.

[dependencies]
# The 13 provider extractors, HTTP clients, streaming proxy, cache and the
# CORS/rate-limit policy — shared with the phone resolver rather than copied,
# so provider fixes land in both services at once.
pstream-shared = { git = "https://github.com/Coderia397/pstream-resolver-rs", branch = "main" }

tokio      = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal", "process", "fs"] }
axum       = { version = "0.7", default-features = false, features = ["http1", "json", "query", "tokio", "matched-path"] }
tower-http = { version = "0.6", features = ["cors", "fs"] }

# rustls rather than OpenSSL, matching the resolver — keeps the container
# free of a system TLS dependency.
reqwest    = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "brotli", "cookies", "stream"] }

serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
regex       = "1"
once_cell   = "1"
futures     = "0.3"
bytes       = "1"
urlencoding = "2"

# ── replacing the JS dependencies ────────────────────────────────────────────
redis         = { version = "0.27", features = ["tokio-comp", "connection-manager"] }  # ioredis
jsonwebtoken  = "9"                                                                    # jsonwebtoken
ed25519-dalek = { version = "2", features = ["rand_core"] }                            # tweetnacl sign/verify
rand          = "0.8"
base64        = "0.22"
hex           = "0.4"
dotenvy       = "0.15"                                                                 # dotenv
chrono        = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 4
